[workspace]
resolver = "2"
members = [
  "crates/core",
  "apps/desktop",
  "apps/cli",
  "apps/updater",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
authors = ["Allan Security"]
license = "MIT"
repository = "https://github.com/mccartney0/allan-security"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde", "clock"] }
ctrlc = "3.4"
eframe = "0.31"
egui = "0.31"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rfd = "0.15"
rsa = { version = "0.9", features = ["sha2"] }
rusqlite = { version = "0.32", features = ["bundled"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.14"
thiserror = "2.0"
notify = { version = "8.2", default-features = false }
object = { version = "0.40", default-features = false, features = ["read"] }
yara-x = { version = "1.19", default-features = false }
